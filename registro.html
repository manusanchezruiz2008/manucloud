```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManuCloud - Crear cuenta</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <div class="logo">
                ☁️
            </div>

            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Únete a ManuCloud
            </p>


            <form id="registroForm">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Crear cuenta
                </button>

            </form>


            <p id="mensaje"></p>


            <p class="registro">

                ¿Ya tienes cuenta?

                <a href="index.html">
                    Iniciar sesión
                </a>

            </p>

        </div>

    </main>


    <script type="module" src="js/registro.js"></script>

</body>

</html>
```
