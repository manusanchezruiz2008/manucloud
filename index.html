```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManuCloud - Iniciar sesión</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <div class="logo">
                ☁️
            </div>

            <h1>ManuCloud</h1>

            <p class="subtitulo">
                Tu nube personal
            </p>

            <form id="loginForm">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >


                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p id="mensaje"></p>

            <p class="registro">
                ¿No tienes cuenta?
                <a href="registro.html">
                    Crear una cuenta
                </a>
            </p>

        </div>

    </main>


    <script type="module" src="js/login.js"></script>

</body>

</html>
```
